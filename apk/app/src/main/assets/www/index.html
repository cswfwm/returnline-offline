      const copy = { name: L('归线', 'Return Line'), tagline: L('洞潜探险游戏', 'CAVE DIVING ADVENTURE'), opened: L('页面已打开', 'Page open'), resources: L('游戏资源', 'Game resources'), entrance: L('准备洞口', 'Preparing the cave') };
      screen.querySelectorAll('[data-boot-copy]').forEach((el) => { el.textContent = copy[el.dataset.bootCopy]; });
      status.textContent = L('正在加载游戏…', 'Loading the game…');
      const quips = [
        [L('先把引导线系好，再下水。', 'Tie off the guideline before you dive.')],
        [L('潜水前请先确认自己还在。', 'Before you dive, please make sure you are still here.')],
        [L('线是你的朋友。', 'The line is your friend.')],
        [L('水下卖烤肠的正在备货。', 'The underwater sausage seller is restocking.')],
        [L('队友正在假装自己没迷路。', 'Your buddy is pretending not to be lost.')],
        [L('返航压力是建议，请认真对待建议。', 'Turn pressure is a suggestion. Please take suggestions seriously.')],
      ];
      note.textContent = quips[Math.floor(Math.random() * quips.length)][0];
      retry.textContent = L('重新加载', 'Reload');
      retry.onclick = () => location.reload();
      const build = "cce49ab";
      // One automatic reload per tab for a failed download: a dropped connection, or a page opened just before a
      // deploy replaced its files (old chunks are gone), usually loads on a fresh page. Cleared once the game runs.
      const RETRY_KEY = 'returnline.boot.retry';
      // Without readable storage the tab cannot remember that it already retried, so it never reloads by itself.
      let retried = 1;
      try { retried = sessionStorage.getItem(RETRY_KEY) ? 1 : 0; } catch {}
      let active = true;
      let reloading = false;
      let leaving = false;
      let entered = false;
      let entryFailed = false;
      let failedFile = '';
      let slow;
      let resolveEntry;
      // Downloads cancelled because the visitor is leaving are not failures.
      addEventListener('pagehide', () => { leaving = true; });
      addEventListener('pageshow', () => { leaving = false; });
      const fileOf = (src) => String(src || '').split(/[?#]/)[0].split('/').pop() || '';
      const report = () => {};
      const entry = new Promise((resolve) => { resolveEntry = resolve; });
      const enter = () => {
        if (entered) return;
        entered = true;
        // Download the game and CSS together.
        document.querySelectorAll('link[data-boot-href]').forEach((link) => { link.href = link.dataset.bootHref; });
        performance.mark('returnline:loading');
        slow = setTimeout(() => {
          if (!active) return;
          note.textContent = L('首次打开需要下载游戏资源。网络较慢时，可以继续等一会儿或重新加载。', 'The first visit downloads the game. On a slow connection, give it a little longer or reload.');
          retry.hidden = false;
        }, 8000);
        resolveEntry();
        if (entryFailed) window.returnlineBoot.fail();
      };
      // Vite rewrites the module tag; a capture listener survives that rewrite. Only the game's own entry counts:
      // Cloudflare injects its analytics beacon as a cross-origin module script, and ad blockers stop it, which
      // used to put the failure screen over a game that had loaded fine.
      const ownScript = (el) => { try { return new URL(el.src, location.href).origin === location.origin; } catch { return false; } };
      const entryError = (event) => {
        if (event.target instanceof HTMLScriptElement && event.target.type === 'module' && ownScript(event.target)) { entryFailed = true; failedFile = fileOf(event.target.src); if (entered) window.returnlineBoot.fail(); }
      };
      addEventListener('error', entryError, true);
      // A download that failed (not code that broke): worth one fresh page before showing the error.
      const retryable = (error) => !error || /dynamically imported module|Importing a module script|preload CSS|Failed to fetch|Load failed|NetworkError/i.test(String(error.message || error));
      window.returnlineBoot = {
        entered: entry,
        prepare() {
          if (!active) return;
          screen.dataset.stage = 'prepare';
          screen.querySelector('[data-step="download"]').classList.add('done');
          status.textContent = L('正在准备洞口…', 'Preparing the cave…');
          performance.mark('returnline:preparing');
        },
        ready() {
          // A game that did start always gets the screen back, even after a failure was shown.
          if (reloading || !screen.isConnected) return;
          active = false;
          clearTimeout(slow);
          removeEventListener('error', entryError, true);
          try { sessionStorage.removeItem(RETRY_KEY); } catch {}
          screen.remove();
          performance.mark('returnline:ready');
        },
        fail(error) {
          if (!active || leaving) return;
          const text = String(error && error.message || error || 'entry script failed');
          if (!retried && retryable(error)) {
            try {
              sessionStorage.setItem(RETRY_KEY, '1');
              active = false;
              reloading = true;
              report('boot retry: ' + text, error);
              location.reload();
              return;
            } catch { active = true; reloading = false; }
          }
          active = false;
          // A load that stops here would otherwise never be counted: this page runs before the game's own reporting exists.
          report('boot: ' + text, error);
          clearTimeout(slow);
          removeEventListener('error', entryError, true);
          screen.dataset.stage = 'failed';
          screen.setAttribute('aria-busy', 'false');
          status.textContent = L('游戏加载未完成', 'The game could not load');
          note.textContent = L('请检查网络后重新加载。你的本地存档不会被清除。', 'Check your connection, then reload. Your local save will be kept.');
          retry.hidden = false;
        }
      };
      enter();
    })();
  </script>
</body>
</html>
