name: Build APK

on:
  push:
    branches: [ main ]
    paths:
      - 'apk/**'
      - 'src/**'
      - 'tools/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "sdk.dir=$SDK" > apk/local.properties

      - name: Generate signing key
        working-directory: apk
        run: |
          keytool -genkeypair -v \
            -keystore keystore.p12 \
            -storetype PKCS12 \
            -storepass returnline123 \
            -keypass returnline123 \
            -alias returnline \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Return Line, OU=Offline, O=ReturnLine, L=, S=, C=CN"

      - name: Grant gradlew
        run: chmod +x ./apk/gradlew

      - name: Build Release APK
        working-directory: apk
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: returnline-offline-apk
          path: apk/app/build/outputs/apk/release/*.apk
          retention-days: 30
